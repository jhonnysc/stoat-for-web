min_version = { soft = "2026.5.15", hard = "2026.5.12" }

[tools]
deno = "2.8.1"
node = "26.2.0"
pnpm = "11.17.0"

gh = "2.93.0"

mdbook = { version = "0.5.3", platforms = "linux-x64,macos,windows" }
"github:lzanini/mdbook-katex" = { version = "0.10.0-alpha-binaries", platforms = "linux-x64,macos,windows" }

"github:git-town/git-town" = "23.0.1"

[tasks.check]
description = "Task group for CI checks"
run = [
    { task = "install:frozen" },
    { task = "build:deps" },
    { task = "build" },
    { tasks = [
        "lint",
        "*:check",
    ] },
    { task = "format" },
    { task = "test:e2e:install-deps" },
    { tasks = [
        "test:e2e",
    ] },
]

